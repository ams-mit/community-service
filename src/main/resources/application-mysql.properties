# MySQL Cloud / Local Configuration (TiDB Cloud, Aiven, Railway, Local Docker)
# Activate with: -Dspring-boot.run.profiles=mysql
# Or set SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/community_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Petkitty@2002}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hikari Connection Pool settings for cloud databases
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
