# MySQL Cloud Configuration (Aiven MySQL Cloud)
# Activate with: -Dspring-boot.run.profiles=mysql
# Or set SPRING_PROFILES_ACTIVE=mysql

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-744796c-kaveeshavimukthiai-6aca.f.aivencloud.com:21365/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# Hikari Connection Pool settings for cloud databases
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

