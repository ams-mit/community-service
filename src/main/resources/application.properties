spring.application.name=community-service
server.port=8085

# Active database profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Embedded persistent H2 database
# Used when no external database profile is active
spring.datasource.url=jdbc:h2:file:./data/community_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

info.app.name=community-service
info.app.description=Project A Community Service (Visitors, Announcements, Notifications)
info.app.version=0.0.1-SNAPSHOT

# JWT Security Configuration
jwt.gateway.public-key=${GATEWAY_JWT_PUBLIC_KEY:}
jwt.security.enabled=${JWT_SECURITY_ENABLED:true}
jwt.internal.allowed-services=operations-service,billing-payment-service,utility-charge-service,lease-occupancy-service,resident-management-service,property-unit-service