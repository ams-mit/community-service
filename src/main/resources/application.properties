spring.application.name=community-service
server.port=8085

# Active Profile: set to 'postgres' for PostgreSQL, 'mysql' for MySQL, or empty for embedded H2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Embedded persistent database (starts without needing external MySQL running)
# To use external MySQL, activate the 'mysql' profile: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:h2:file:./data/community_service_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (optional web console at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Endpoints (COMM-011, COMM-012)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.info.env.enabled=true

info.app.name=community-service
info.app.description=AMS Community Service API (Facilities, Reservations, Visitors, Announcements, Notifications)
info.app.version=0.0.1-SNAPSHOT
