services:
  community-db:
    image: mysql:8.0
    container_name: community-db
    environment:
      MYSQL_DATABASE: community_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - community_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  community-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://community-db:3306/community_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      community-db:
        condition: service_healthy

volumes:
  community_db_data: